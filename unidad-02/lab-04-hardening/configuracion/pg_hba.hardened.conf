# =====================================================================
# pg_hba.conf endurecido - LAB-04 (Estudiante: Zamora Serrano Irvin Donovan)
# TYPE     DATABASE   USER            ADDRESS         METHOD
# Principio: base de datos + usuario + origen + metodo, lo mas especifico posible.
# Si ssl = off, cambiar "hostssl" por "host" y documentarlo como pendiente.
# =====================================================================

# Administracion local dentro del contenedor (via docker exec). Aceptado: el
# acceso al socket requiere entrar al contenedor.
local      all        postgres                        trust

# Cualquier otra cuenta local debe autenticarse
local      all        all                             scram-sha-256

# Administrador por TCP local, con TLS y contrasena
hostssl    all        postgres        127.0.0.1/32    scram-sha-256
hostssl    all        postgres        ::1/128         scram-sha-256

# Cuentas de aplicacion y consulta: solo su base, solo origen local, TLS + SCRAM
hostssl    postgres   app_user        127.0.0.1/32    scram-sha-256
hostssl    postgres   app_user        ::1/128         scram-sha-256
hostssl    postgres   consulta_user   127.0.0.1/32    scram-sha-256
hostssl    postgres   consulta_user   ::1/128         scram-sha-256

# Denegacion explicita de todo lo demas
host       all        all             0.0.0.0/0       reject
host       all        all             ::/0            reject
